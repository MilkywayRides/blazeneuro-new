name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint || true
    
    - name: Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: .next
        retention-days: 7

  android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare Android version
      id: version
      shell: bash
      run: |
        VERSION_NAME="${GITHUB_REF_NAME#v}"
        if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
          VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}"
        fi
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Decode Android signing key
      shell: bash
      env:
        ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      run: |
        if [[ -n "$ANDROID_SIGNING_KEY_BASE64" ]]; then
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/blazeneuro-release.jks"
        fi

    - name: Build Android APK
      working-directory: android
      env:
        VERSION_CODE: ${{ steps.version.outputs.version_code }}
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/blazeneuro-release.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [[ -f "$ANDROID_KEYSTORE_PATH" ]]; then
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/blazeneuro-update.apk
        else
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/blazeneuro-update.apk
        fi

    - name: Upload Android APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: blazeneuro-android-apk
        path: android/app/build/outputs/blazeneuro-update.apk
        retention-days: 30

  android-release:
    needs: android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download Android APK artifact
      uses: actions/download-artifact@v4
      with:
        name: blazeneuro-android-apk
        path: release

    - name: Rename APK for release
      shell: bash
      run: mv release/blazeneuro-update.apk "release/blazeneuro-${GITHUB_REF_NAME}.apk"

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/blazeneuro-${{ github.ref_name }}.apk
        generate_release_notes: true
        body: |
          Android versionCode: ${{ github.run_number }}

          This release was built automatically by GitHub Actions. The Android app checks this latest GitHub Release and prompts users to install the APK when the versionCode is newer than the installed app.

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: blazeneuro:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
